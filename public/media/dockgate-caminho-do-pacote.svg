<svg xmlns="http://www.w3.org/2000/svg" width="352" height="345" viewBox="0 0 352 345" role="img" aria-labelledby="title desc">
  <title id="title">Dois destinos, dois caminhos no firewall</title>
  <desc id="desc">Uma conexão SSH termina num processo no VPS e segue pela cadeia input. No exemplo com Docker, o destino da porta HTTPS pública é traduzido para o contêiner. Como o VPS encaminha a conexão, ela passa por forward.</desc>
  <rect width="352" height="345" rx="16" fill="#14242d"/>
  <g fill="#203743" stroke="#50707e">
    <rect x="16" y="17" width="320" height="53" rx="8"/>
    <rect x="16" y="110" width="152" height="83" rx="8"/>
    <rect x="184" y="110" width="152" height="83" rx="8"/>
    <rect x="16" y="229" width="152" height="99" rx="8"/>
    <rect x="184" y="229" width="152" height="99" rx="8"/>
  </g>
  <g fill="none" stroke="#8fd7cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 71v15H92v16m-4-4 4 4 4-4m80-12h84v16m-4-4 4 4 4-4"/>
    <path d="M92 194v27m-4-4 4 4 4-4m164-23v27m-4-4 4 4 4-4"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#f2f8fa" font-size="16">
    <text x="176" y="49" font-size="18" font-weight="700">Pacote chega ao VPS</text>
    <text x="92" y="141" font-weight="700">SSH · 22</text>
    <text x="92" y="171">Destino: VPS</text>
    <text x="260" y="141" font-weight="700">HTTPS · 443</text>
    <text x="260" y="171">DNAT do Docker</text>
    <text x="92" y="260" font-family="monospace" fill="#b1ece2">input</text>
    <text x="92" y="296">SSH no host</text>
    <text x="260" y="260" font-family="monospace" fill="#b1ece2">forward</text>
    <text x="260" y="287">Nginx:443</text>
    <text x="260" y="311">no contêiner</text>
  </g>
</svg>
