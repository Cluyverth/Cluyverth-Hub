<svg xmlns="http://www.w3.org/2000/svg" width="336" height="342" viewBox="0 0 336 342" role="img" aria-labelledby="title desc">
  <title id="title">A aplicação participa de duas redes</title>
  <desc id="desc">O Nginx chega ao serviço app pela rede dockgate_proxy. O app também fica na rede default, junto com o banco db. O Nginx e o banco não compartilham rede.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="m2 1 4 3-4 3" fill="none" stroke="#8fd7cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="336" height="342" rx="16" fill="#14242d"/>
  <g fill="#203743" stroke="#50707e">
    <rect x="16" y="16" width="304" height="144" rx="8"/>
    <rect x="16" y="180" width="304" height="146" rx="8"/>
  </g>
  <g fill="#14242d" stroke="#64998f">
    <rect x="32" y="60" width="96" height="44" rx="5"/>
    <rect x="132" y="123" width="72" height="94" rx="5"/>
    <rect x="222" y="258" width="82" height="44" rx="5"/>
  </g>
  <g fill="none" stroke="#8fd7cb" stroke-width="2" marker-end="url(#arrow)">
    <path d="M128 82h40v32"/>
    <path d="M168 217v63h45"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#f2f8fa">
    <g fill="#b1ece2" font-size="14">
      <text x="32" y="42">Rede dockgate_proxy</text>
      <text x="32" y="207">Rede default</text>
    </g>
    <g font-size="17" font-weight="650" text-anchor="middle">
      <text x="80" y="88">Nginx</text>
      <text x="168" y="176">app</text>
      <text x="263" y="286">db</text>
    </g>
  </g>
</svg>
