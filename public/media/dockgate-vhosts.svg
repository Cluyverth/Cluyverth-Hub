<svg xmlns="http://www.w3.org/2000/svg" width="336" height="354" viewBox="0 0 336 354" role="img" aria-labelledby="title desc">
  <title id="title">Qual bloco server atende o pedido?</title>
  <desc id="desc">Na porta 80, app e blog redirecionam para HTTPS. Outros domínios recebem 404. Na porta 443, app segue para app:80 e blog para blog:80. Um SNI sem nome reconhecido faz o Nginx recusar o TLS. Se o TLS já foi aceito, mas o Host é desconhecido, a resposta é 404.</desc>
  <rect width="336" height="354" rx="16" fill="#14242d"/>
  <g fill="#203743" stroke="#50707e">
    <rect x="16" y="16" width="304" height="151" rx="8"/>
    <rect x="16" y="183" width="304" height="155" rx="8"/>
  </g>
  <path d="M32 53h272M32 220h272" stroke="#50707e"/>
  <g font-family="system-ui, sans-serif" fill="#f2f8fa">
    <g font-size="17" font-weight="650">
      <text x="32" y="43">HTTP · porta 80</text>
      <text x="32" y="210">HTTPS · porta 443</text>
    </g>
    <g font-size="14">
      <text x="32" y="80">app.example.com</text>
      <text x="32" y="112">blog.example.com</text>
      <text x="32" y="144">Outro domínio</text>
      <text x="32" y="245">app.example.com</text>
      <text x="32" y="270">blog.example.com</text>
      <text x="32" y="295">SNI desconhecido</text>
      <text x="32" y="320">TLS aceito, Host inválido</text>
      <g fill="#b1ece2">
        <text x="304" y="80" text-anchor="end">→ 308 para HTTPS</text>
        <text x="304" y="112" text-anchor="end">→ 308 para HTTPS</text>
        <text x="304" y="144" text-anchor="end">→ 404</text>
        <text x="304" y="245" text-anchor="end">→ app:80</text>
        <text x="304" y="270" text-anchor="end">→ blog:80</text>
        <text x="304" y="295" text-anchor="end">→ TLS recusado</text>
        <text x="304" y="320" text-anchor="end">→ 404</text>
      </g>
    </g>
  </g>
</svg>
